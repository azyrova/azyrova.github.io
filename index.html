<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azyrova Group - Under Construction</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        /* Full-width Top Banner Layout */
        .banner-container {
            width: 100%;
            height: 250px; /* Adjust height based on your banner proportions */
            overflow: hidden;
            margin-bottom: 40px;
            background-color: #f5f5f5;
        }
        .banner-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .container {
            max-width: 700px;
            padding: 0 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Customized Logo Layout */
        .logo-image {
            max-width: 220px; /* Limits the size so it looks elegant */
            height: auto;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 20px;
            color: #000000;
        }
        .message-top {
            font-size: 1.25rem;
            font-style: italic;
            color: #333333;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .form-container {
            display: flex;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            border: 1px solid #cccccc;
        }
        .email-input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            font-size: 1rem;
            outline: none;
            color: #666666;
            background-color: #fafafa;
        }
        .notify-btn {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .notify-btn:hover {
            background-color: #333333;
        }
        .message-bottom {
            font-size: 0.95rem;
            color: #888888;
        }
    </style>
</head>
<body>

    <!-- Top Banner Element -->
    <div class="banner-container">
        <img src="Azyrova_Group_banner_1_.webp" alt="Azyrova Group Banner" class="banner-image">
    </div>

    <div class="container">
        <!-- Main Brand Logo Element -->
        <img src="Azyrova_Final_logo_logo_scaled_under_5mb.webp" alt="Azyrova Group Logo" class="logo-image">

        <h1>Under Construction</h1>
        
        <p class="message-top">Our website is under construction, but we are ready to<br>go! Special surprise for our subscribers only</p>
        
        <div class="form-container">
            <input type="email" class="email-input" placeholder="Enter a valid email address" required>
            <button class="notify-btn">Notify Me</button>
        </div>

        <p class="message-bottom">Sign up now to get early notification of our launch date!</p>
    </div>

</body>
</html>

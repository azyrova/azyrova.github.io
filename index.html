    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Orbitron", sans-serif;
        background: radial-gradient(circle, #1a1c24 0%, #0d0e12 100%);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow-x: hidden;
      }
      .app-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        width: 100%;
        max-width: 900px;
      }
      .stage-3d {
        width: 100%;
        max-width: 440px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 25px;
        text-align: center;
        position: relative;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        transition:
          transform 0.5s ease,
          box-shadow 0.5s ease;
      }
      .stage-3d:hover {
        transform: scale(0.97) rotateX(-4deg) rotateY(3deg);
        border-color: rgba(255, 153, 0, 0.3);
      }
      .banner-view {
        width: 100%;
        height: 140px;
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 50px;
        background: #232d37;
      }
      .banner-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar-view {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 4px solid #1a1c24;
        overflow: hidden;
        position: absolute;
        top: 95px;
        left: 50%;
        transform: translateX(-50%);
        background: #2a3543;
      }
      .logo-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      h1 {
        font-size: 1.8rem;
        margin-bottom: 8px;
      }
      .bio {
        font-size: 0.9rem;
        color: #8a8f98;
        margin-bottom: 20px;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 20px;
        border-radius: 16px;
        margin-bottom: 20px;
      }
      .glass-panel h2 {
        font-size: 1rem;
        color: #ff9900;
        margin-bottom: 4px;
      }
      .glass-panel p {
        font-size: 0.8rem;
        color: #6c727d;
        margin-bottom: 12px;
      }
      .terminal-log {
        background: rgba(0, 0, 0, 0.4);
        font-family: monospace;
        font-size: 0.75rem;
        color: #00ff66;
        text-align: left;
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      .form-layout {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .email-field {
        width: 100%;
        padding: 12px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #ffffff;
        outline: none;
      }
      .glow-btn {
        background: linear-gradient(90deg, #ff9900 0%, #ffb703 100%);
        color: #0d0e12;
        border: none;
        padding: 12px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
      }
      .social-nodes {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .social-link {
        color: #8a8f98;
        text-decoration: none;
        width: 36px;
        height: 36px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s ease;
      }
      .social-link svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .social-link:hover {
        color: #ffffff;
        background: rgba(255, 153, 0, 0.2);
        border-color: #ff9900;
      }
      .qr-display-box {

        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 20px;
        border-radius: 20px;
        text-align: center;

        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

        border-radius: 12px;
        background: #ffffff;
        padding: 8px;
      }

        color: #8a8f98;
        line-height: 1.4;

          align-items: center;

          position: absolute;
          inset: 2px; /* Leaves exactly 2px space around the edge for the border line */

          left: -50%;

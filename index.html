<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azyrova Group</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle, #1a1c24 0%, #0d0e12 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 950px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }

    /* MAIN CARD */
    .main-rgb-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      padding: 25px;
      border-radius: 24px;
      text-align: center;
      overflow: hidden;
      z-index: 1;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }

    .main-rgb-card-bg {
      position: absolute;
      inset: 2px;
      background: #14151c;
      border-radius: 22px;
      z-index: -1;
    }

    @keyframes spinRGB {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .main-rgb-card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        #ff0000,
        #ff7700,
        #ffea00,
        #00ff66,
        #00b4d8,
        #7a00ff,
        #ff00aa,
        #ff0000
      );
      z-index: -2;
      animation: spinRGB 4s linear infinite;
    }

    /* BANNER */
    .banner-view {
      width: 100%;
      height: 140px;
      margin-bottom: 50px;
      border-radius: 16px;
      overflow: hidden;
      background: #232d37;
    }

    .banner-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* LOGO */
    .avatar-view {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid #14151c;
      overflow: hidden;
      background: #2a3543;
      z-index: 10;
    }

    .logo-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .bio {
      color: #8a8f98;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* CONTENT */
    .glass-panel {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .glass-panel h2 {
      color: #ff9900;
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .glass-panel p {
      color: #6c727d;
      font-size: 0.8rem;
      margin-bottom: 12px;
    }

    .terminal-log {
      background: rgba(0, 0, 0, 0.4);
      color: #00ff66;
      font-family: monospace;
      font-size: 0.75rem;
      text-align: left;
      padding: 9px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      min-height: 32px;
    }

    .form-layout {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .email-field {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      outline: none;
    }

    .email-field::placeholder {
      color: #777d87;
    }

    .glow-btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #ff9900, #ffb703);
      color: #0d0e12;
      font-weight: bold;
      cursor: pointer;
    }

    .glow-btn:hover {
      filter: brightness(1.1);
    }

    /* SOCIALS */
    .social-nodes {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .social-link {
      width: 36px;
      height: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #8a8f98;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      transition: 0.3s;
    }

    .social-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .social-link:hover {
      color: #fff;
      background: rgba(255, 153, 0, 0.2);
      border-color: #ff9900;
    }

    /* QR CARD */
    .qr-display-box {
      width: 100%;
      max-width: 244px;
      padding: 28px 22px;
      border-radius: 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;

      background: rgba(20, 21, 28, 0.4);
      border: 1px solid rgba(160, 32, 240, 0.2);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 15px 35px rgba(160, 32, 240, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);

      animation: breathing 5s ease-in-out infinite;
    }

    @keyframes breathing {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-3px) scale(1.015);
      }
    }

    .qr-image-wrapper {
      width: 100%;
      max-width: 180px;
      padding: 10px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .qr-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
    }

    .qr-display-box p {
      color: #8a8f98;
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .qr-display-box strong {
      color: #fff;
    }

    /* DESKTOP */
    @media (min-width: 768px) {
      .app-container {
        flex-direction: row;
        gap: 50px;
      }
    }
  </style>
</head>

<body>

    <!-- QR CARD -->

</div>

      <p>
        Scan or click the QR Code to explore

    </div>

  </div>

      "> Core matrix online...",

      if (logText) {

        index = (index + 1) % logs.length;
      }
    }, 1300);
  </script>

</body>
</html>

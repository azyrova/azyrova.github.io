<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 700px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 40px;
            color: #000000;
        }
        .graphic-container {
            margin-bottom: 40px;
        }
        /* Created a stylized modern CSS barrier placeholder since external images can break */
        .barrier-placeholder {
            width: 180px;
            height: 120px;
            background: linear-gradient(45deg, #f39c12 25%, #2c3e50 25%, #2c3e50 50%, #f39c12 50%, #f39c12 75%, #2c3e50 75%, #2c3e50);
            background-size: 40px 40px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .barrier-sign {
            background-color: #f1c40f;
            color: #000;
            font-weight: bold;
            padding: 10px;
            border: 3px solid #000;
            transform: rotate(-10deg);
            font-size: 0.8rem;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .message-top {
            font-size: 1.25rem;
            font-style: italic;
            color: #333333;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .form-container {
            display: flex;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            border: 1px solid #cccccc;
        }
        .email-input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            font-size: 1rem;
            outline: none;
            color: #666666;
            background-color: #fafafa;
        }
        .notify-btn {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .notify-btn:hover {
            background-color: #333333;
        }
        .message-bottom {
            font-size: 0.95rem;
            color: #888888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Under Construction</h1>
        
        <div class="graphic-container">
            <!-- Pure CSS graphic placeholder for the construction sign -->
            <div class="barrier-placeholder">
                <div class="barrier-sign">Under<br>Work</div>
            </div>
        </div>

        <p class="message-top">Our website is under construction, but we are ready to<br>go! Special surprise for our subscribers only</p>
        
        <div class="form-container">
            <input type="email" class="email-input" placeholder="Enter a valid email address" required>
            <button class="notify-btn">Notify Me</button>
        </div>

        <p class="message-bottom">Sign up now to get early notification of our launch date!</p>
    </div>

</body>
</html>
